<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tienda — Avelinas</title>
  <meta name="description" content="Productos que usamos y recomendamos en Avelinas." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
  <style>
    /* Tokens y base duplicados de index.html a propósito (la landing no se refactoriza). */
    :root{--olive:#5a6348;--olive-deep:#3e4733;--olive-mid:#6e7d5b;--olive-light:#8fa07a;--olive-pale:#c8d3b0;--cream:#f6f1e9;--cream-dark:#ede5d4;--cream-mid:#e4d9c4;--white:#fdfaf5;--ink:#252820;--ink-mid:#484b3e;--ink-soft:#7a7d6d;--serif:'Cormorant Garamond',Georgia,serif;--sans:'DM Sans',system-ui,sans-serif;}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{background:var(--cream);color:var(--ink);font-family:var(--sans);font-weight:300;overflow-x:hidden;line-height:1.5;}

    /* NAV */
    nav{position:fixed;top:0;left:0;right:0;z-index:200;padding:12px 60px;display:flex;align-items:center;justify-content:space-between;gap:20px;background:rgba(246,241,233,0.93);backdrop-filter:blur(16px);border-bottom:1px solid rgba(90,99,72,0.10);}
    .nav-logo{display:flex;align-items:center;text-decoration:none;font-family:var(--serif);font-size:1.55rem;color:var(--olive);}
    .nav-logo img{height:64px;width:auto;display:block;}
    .nav-links{display:flex;gap:30px;list-style:none;}
    .nav-links a{text-decoration:none;font-size:.78rem;font-weight:400;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-mid);transition:color .2s;}
    .nav-links a:hover,.nav-links a.activo{color:var(--olive);}
    .nav-btn{background:var(--olive);color:var(--white);padding:10px 22px;border-radius:50px;font-size:.78rem;font-weight:400;letter-spacing:.08em;text-decoration:none;transition:background .2s;white-space:nowrap;}
    .nav-btn:hover{background:var(--olive-mid);}

    /* CABECERA: etiqueta, título en una línea y subtítulo, arriba del buscador */
    main{padding:112px 40px 80px;max-width:1500px;margin:0 auto;}
    .sec-label{font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;color:var(--olive-mid);font-weight:400;display:flex;align-items:center;gap:10px;margin-bottom:8px;}
    .sec-label::before{content:'';width:22px;height:1px;background:var(--olive-mid);display:block;}
    .t-hdr{margin-bottom:22px;}
    .t-titulo{font-family:var(--serif);font-size:2rem;font-weight:600;line-height:1.15;color:var(--ink);letter-spacing:-.005em;white-space:nowrap;}
    .t-titulo em{font-style:normal;color:var(--olive-mid);}
    .t-hdr p{margin-top:6px;font-size:.86rem;line-height:1.6;color:var(--ink-soft);max-width:560px;}
    .preview-banner{background:#f3e3b8;border:1px solid #d9bd72;color:#6b5314;border-radius:12px;padding:10px 16px;font-size:.84rem;font-weight:400;margin-bottom:18px;text-align:center;}

    /* FILTROS: buscador + marca, y chips de categoría */
    .t-filtros{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
    .t-filtros[hidden]{display:none;}
    .t-inp,.t-sel{font-family:var(--sans);font-size:.84rem;font-weight:300;color:var(--ink);background:var(--white);border:1.5px solid var(--cream-mid);border-radius:50px;padding:9px 16px;outline:none;transition:border-color .2s;}
    .t-inp{flex:1 1 240px;min-width:0;}
    .t-sel{flex:0 1 200px;min-width:0;cursor:pointer;}
    .t-inp:focus,.t-sel:focus{border-color:var(--olive-mid);}
    .t-sel[hidden]{display:none;}
    .t-chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px;}
    .t-chips[hidden]{display:none;}
    .t-chip{font-family:var(--sans);font-size:.76rem;font-weight:400;letter-spacing:.02em;color:var(--ink-mid);background:var(--white);border:1.5px solid var(--cream-mid);border-radius:50px;padding:7px 15px;cursor:pointer;transition:all .2s;}
    .t-chip:hover{border-color:var(--olive-mid);color:var(--olive);}
    .t-chip.act{background:var(--olive);border-color:var(--olive);color:var(--white);}

    /* GRILLA: 6 / 5 (≤1280) / 4 (≤1000) / 3 (≤820) / 2 (≤600) / 1 (<340) */
    .t-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px;}
    @media(max-width:1280px){.t-grid{grid-template-columns:repeat(5,minmax(0,1fr));}}
    @media(max-width:1000px){.t-grid{grid-template-columns:repeat(4,minmax(0,1fr));}}
    @media(max-width:820px){.t-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;}}
    @media(max-width:600px){.t-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;}}
    @media(max-width:339px){.t-grid{grid-template-columns:1fr;}}

    /* TARJETA (compacta) */
    .prod-card{background:var(--white);border:1px solid var(--cream-mid);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;min-width:0;transition:box-shadow .25s,transform .25s;}
    .prod-card:hover{box-shadow:0 6px 24px rgba(62,71,51,.10);transform:translateY(-2px);}
    .pc-foto{position:relative;aspect-ratio:1/1;background:var(--cream-dark);overflow:hidden;}
    .pc-foto img{width:100%;height:100%;object-fit:cover;display:block;}
    .pc-vacia{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--olive-light);}
    .pc-vacia svg{width:30px;height:30px;opacity:.7;}
    .pc-badge{position:absolute;top:8px;left:8px;background:var(--olive);color:var(--white);font-size:.56rem;font-weight:400;letter-spacing:.09em;text-transform:uppercase;padding:3px 9px;border-radius:50px;}
    .pc-body{padding:10px 11px 12px;display:flex;flex-direction:column;gap:3px;flex:1;}
    .pc-marca{font-size:.58rem;letter-spacing:.12em;text-transform:uppercase;color:var(--olive-mid);font-weight:400;min-height:1em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .pc-nombre{font-family:var(--serif);font-size:1rem;font-weight:600;line-height:1.2;color:var(--ink);overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-overflow:ellipsis;min-height:2.4em;}
    .pc-precio{font-family:var(--sans);font-size:.92rem;font-weight:500;color:var(--olive-deep);margin-top:auto;padding-top:4px;font-variant-numeric:tabular-nums;}
    .pc-wa{margin-top:6px;display:flex;align-items:center;justify-content:center;gap:6px;text-align:center;text-decoration:none;background:none;border:1.5px solid var(--olive);color:var(--olive);padding:6px 8px;border-radius:50px;font-family:var(--sans);font-size:.72rem;font-weight:400;letter-spacing:.02em;transition:background .2s,color .2s;}
    .pc-wa svg{width:13px;height:13px;flex-shrink:0;}
    .pc-wa:hover{background:var(--olive);color:var(--white);}
    .pc-sinstock{margin-top:6px;text-align:center;font-size:.64rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);padding:7px 0;font-weight:400;}
    .prod-card.agotado .pc-foto,.prod-card.agotado .pc-marca,.prod-card.agotado .pc-nombre,.prod-card.agotado .pc-precio{opacity:.45;}

    /* ESTADOS */
    .t-estado{grid-column:1/-1;text-align:center;padding:60px 20px;}
    .t-estado .ico{font-size:2rem;opacity:.45;margin-bottom:12px;}
    .t-estado h2{font-family:var(--serif);font-size:1.6rem;font-weight:600;margin-bottom:10px;}
    .t-estado h2 em{font-style:normal;color:var(--olive-mid);}
    .t-estado p{font-size:.9rem;color:var(--ink-soft);max-width:380px;margin:0 auto;line-height:1.7;}
    .t-reintentar{margin-top:18px;background:var(--olive);color:var(--white);border:none;padding:12px 30px;border-radius:50px;font-family:var(--sans);font-size:.82rem;cursor:pointer;}
    .t-reintentar:hover{background:var(--olive-mid);}
    .t-cargando{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--ink-soft);font-size:.9rem;}

    @media(max-width:900px){
      nav{padding:10px 22px;}
      .nav-logo img{height:52px;}
      .nav-links{display:none;}
      main{padding:96px 22px 60px;}
    }
    @media(max-width:600px){
      .nav-btn{padding:9px 16px;font-size:.72rem;}
      .t-sel{flex:1 1 140px;}
    }
    @media(max-width:499px){
      .t-titulo{white-space:normal;font-size:1.7rem;}
    }
  </style>
</head>
<body>

<nav>
  <a href="/" class="nav-logo" aria-label="Avelinas — inicio">
    <img src="https://lh3.googleusercontent.com/d/1qybhZ-VI4Kyjer-kWVeVCrQOlZS47Jnc" alt="Avelinas"/>
  </a>
  <ul class="nav-links">
    <li><a href="/">Inicio</a></li>
    <li><a href="/#turnos">Turnos</a></li>
    <li><a href="/tienda" class="activo">Tienda</a></li>
    <li><a href="/#club">Club</a></li>
    <li><a href="/#contacto">Contacto</a></li>
  </ul>
  <a href="/#turnos" class="nav-btn">Reservar turno</a>
</nav>

<main>
  <div class="t-hdr">
    <div class="sec-label">Nuestra tienda</div>
    <h1 class="t-titulo">Productos para <em>seguir brillando</em></h1>
    <p>Lo que usamos y recomendamos. Consultanos por WhatsApp y te contamos cómo conseguirlos.</p>
  </div>

  <div id="previewBanner" class="preview-banner" hidden>Vista previa — datos de ejemplo</div>

  <div class="t-filtros" id="filtros" hidden>
    <input class="t-inp" type="search" id="fBuscar" placeholder="Buscar producto, marca o categoría…" aria-label="Buscar productos" autocomplete="off">
    <select class="t-sel" id="fMarca" aria-label="Filtrar por marca" hidden></select>
  </div>
  <div class="t-chips" id="fChips" role="group" aria-label="Categorías" hidden></div>

  <div class="t-grid" id="grilla"><div class="t-cargando">Cargando productos…</div></div>
</main>

<script>
  const API='https://porto-estudio-avelinas-api.67iz4w.easypanel.host';
  const WA='542494623097';

  // Todo texto que viene de la base se escapa antes de entrar a un HTML.
  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
  const norm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
  const precioTxt=n=>'$'+Number(n||0).toLocaleString('es-AR',{maximumFractionDigits:0});
  // Solo se aceptan fotos http(s): una URL rara de la base no puede ser un javascript:.
  const fotoSegura=u=>/^https?:\/\//i.test(String(u||''))?u:null;

  const $=id=>document.getElementById(id);
  const ICONO_VACIO='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>';
  const ICONO_WA='<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"/></svg>';

  let PRODUCTOS=[];

  function waLink(p){
    const txt='Hola! Me interesa: '+p.nombre+' ('+precioTxt(p.precio_publico)+')';
    return 'https://wa.me/'+WA+'?text='+encodeURIComponent(txt);
  }

  function tarjeta(p){
    const foto=fotoSegura(p.foto_url);
    const agotado=p.disponible===false;
    return '<article class="prod-card'+(agotado?' agotado':'')+'">'+
      '<div class="pc-foto">'+
        (foto?'<img src="'+esc(foto)+'" alt="'+esc(p.nombre)+'" loading="lazy">':'<div class="pc-vacia">'+ICONO_VACIO+'</div>')+
        (p.destacado?'<span class="pc-badge">Destacado</span>':'')+
      '</div>'+
      '<div class="pc-body">'+
        '<div class="pc-marca">'+esc(p.laboratorio||'')+'</div>'+
        '<h2 class="pc-nombre" title="'+esc(p.nombre)+'">'+esc(p.nombre)+'</h2>'+
        '<div class="pc-precio">'+esc(precioTxt(p.precio_publico))+'</div>'+
        (agotado?'<div class="pc-sinstock">Sin stock</div>'
                :'<a class="pc-wa" href="'+esc(waLink(p))+'" target="_blank" rel="noopener" aria-label="'+esc('Consultar por WhatsApp: '+p.nombre)+'">'+ICONO_WA+'Consultar</a>')+
      '</div></article>';
  }

  function estado(ico,titulo,texto,extra){
    return '<div class="t-estado"><div class="ico">'+ico+'</div><h2>'+titulo+'</h2><p>'+texto+'</p>'+(extra||'')+'</div>';
  }

  function opciones(sel,valores,todas){
    const actual=sel.value;
    sel.innerHTML='<option value="">'+todas+'</option>'+valores.map(v=>'<option value="'+esc(v)+'">'+esc(v)+'</option>').join('');
    sel.value=valores.includes(actual)?actual:'';
    sel.hidden=!valores.length;
  }

  let catActual='';
  function armarFiltros(){
    const unicos=k=>[...new Set(PRODUCTOS.map(p=>String(p[k]||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'es'));
    opciones($('fMarca'),unicos('laboratorio'),'Todas las marcas');
    const cats=unicos('categoria_tienda');
    if(!cats.includes(catActual)) catActual='';
    const chips=$('fChips');
    chips.hidden=!cats.length;
    chips.innerHTML=cats.length?['']
      .concat(cats).map(c=>'<button type="button" class="t-chip'+(c===catActual?' act':'')+'" data-cat="'+esc(c)+'" aria-pressed="'+(c===catActual)+'">'+esc(c||'Todas')+'</button>').join(''):'';
    $('filtros').hidden=false;
  }

  function render(){
    const q=norm($('fBuscar').value.trim()), marca=$('fMarca').value;
    const lista=PRODUCTOS.filter(p=>
      (!catActual||p.categoria_tienda===catActual)&&(!marca||p.laboratorio===marca)&&
      (!q||q.split(/\s+/).every(w=>norm([p.nombre,p.laboratorio,p.categoria_tienda,p.descripcion].join(' ')).includes(w))));
    $('grilla').innerHTML=lista.length?lista.map(tarjeta).join(''):estado('🔍','Sin resultados','No encontramos productos con esa búsqueda. Probá con otras palabras o limpiá los filtros.');
  }

  // Chips de categoría (delegado: se re-arman al cargar).
  $('fChips').addEventListener('click',e=>{
    const b=e.target.closest('.t-chip'); if(!b) return;
    catActual=b.dataset.cat;
    $('fChips').querySelectorAll('.t-chip').forEach(x=>{const on=x.dataset.cat===catActual;x.classList.toggle('act',on);x.setAttribute('aria-pressed',on);});
    render();
  });

  // Si una foto no carga, se cambia por el recuadro neutro (el evento error no burbujea: se captura).
  $('grilla').addEventListener('error',e=>{
    const img=e.target;
    if(img&&img.tagName==='IMG'){const w=img.parentNode;img.remove();const d=document.createElement('div');d.className='pc-vacia';d.innerHTML=ICONO_VACIO;w.insertBefore(d,w.firstChild);}
  },true);

  // Vista previa (?preview=1): datos inventados, solo con ese parámetro.
  function productosDeEjemplo(){
    const svg=(c1,c2)=>'data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="'+c1+'"/><stop offset="1" stop-color="'+c2+'"/></linearGradient></defs><rect width="200" height="200" fill="url(#g)"/><rect x="78" y="40" width="44" height="120" rx="14" fill="rgba(255,255,255,.55)"/></svg>');
    return [
      {id:1,nombre:'Shampoo reparador 300 ml',descripcion:'Limpia suavemente y repara la fibra capilar dañada por el calor y el color.',categoria_tienda:'Cabello',laboratorio:'Lidherma',precio_publico:18500,foto_url:svg('#c8d3b0','#8fa07a'),destacado:true,disponible:true},
      {id:2,nombre:'Acondicionador hidratante',descripcion:'Hidratación profunda con aceite de argán para un cabello suave y brillante.',categoria_tienda:'Cabello',laboratorio:'Lidherma',precio_publico:17200,foto_url:svg('#e4d9c4','#c9b48a'),destacado:false,disponible:true},
      {id:3,nombre:'Sérum facial vitamina C',descripcion:'Ilumina y unifica el tono de la piel. Uso diario, por la mañana.',categoria_tienda:'Rostro',laboratorio:'Biobellus',precio_publico:32900,foto_url:svg('#f0d9b5','#e0a96d'),destacado:true,disponible:true},
      {id:4,nombre:'Crema de manos nutritiva',descripcion:'Textura liviana de rápida absorción. Ideal después de la manicura.',categoria_tienda:'Cuerpo',laboratorio:'Corea',precio_publico:9800,foto_url:null,destacado:false,disponible:true},
      {id:5,nombre:'Esmalte semipermanente rojo',descripcion:'Color intenso y duradero, secado en cabina LED.',categoria_tienda:'Uñas',laboratorio:'Corea',precio_publico:7400,foto_url:svg('#e7b4a8','#b9584a'),destacado:false,disponible:true},
      {id:6,nombre:'Mascarilla nutritiva con keratina y proteínas de seda para cabello muy dañado',descripcion:'Tratamiento intensivo semanal que devuelve elasticidad, suavidad y brillo desde la primera aplicación, con una descripción bastante larga para probar el recorte.',categoria_tienda:'Cabello',laboratorio:'Biobellus',precio_publico:24600,foto_url:null,destacado:false,disponible:true},
      {id:7,nombre:'Protector solar facial FPS 50',descripcion:'Protección alta, sin brillo y base perfecta para el maquillaje.',categoria_tienda:'Rostro',laboratorio:'Biobellus',precio_publico:21300,foto_url:svg('#d7e3f0','#8fb0cf'),destacado:false,disponible:false},
      {id:8,nombre:'Aceite corporal de almendras',descripcion:'Masaje y nutrición para la piel. Aroma suave.',categoria_tienda:'Cuerpo',laboratorio:'Lidherma',precio_publico:15900,foto_url:svg('#f3e8c8','#d9bd72'),destacado:false,disponible:true},
    ];
  }

  async function cargar(){
    $('grilla').innerHTML='<div class="t-cargando">Cargando productos…</div>';
    try{
      let datos;
      if(new URLSearchParams(location.search).get('preview')==='1'){
        $('previewBanner').hidden=false;
        datos=productosDeEjemplo();
      }else{
        const r=await fetch(API+'/api/tienda/productos?limit=60');
        if(!r.ok) throw new Error('HTTP '+r.status);
        datos=await r.json();
        if(!Array.isArray(datos)) throw new Error('respuesta inválida');
      }
      PRODUCTOS=datos;
      if(!PRODUCTOS.length){
        $('filtros').hidden=true; $('fChips').hidden=true;
        $('grilla').innerHTML=estado('🛍️','Estamos <em>preparando</em> la tienda','Muy pronto vas a encontrar acá los productos que usamos y recomendamos.');
        return;
      }
      armarFiltros();
      render();
    }catch(e){
      $('filtros').hidden=true; $('fChips').hidden=true;
      $('grilla').innerHTML=estado('⚠️','No pudimos cargar la tienda','Revisá tu conexión e intentá de nuevo en un momento.','<button class="t-reintentar" id="btnReintentar" type="button">Reintentar</button>');
      const b=$('btnReintentar'); if(b) b.addEventListener('click',cargar);
    }
  }

  $('fBuscar').addEventListener('input',render);
  $('fMarca').addEventListener('change',render);
  cargar();
</script>
</body>
</html>
